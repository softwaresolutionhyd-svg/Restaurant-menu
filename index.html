<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:   #0A0A0A;
      --black-2: #111111;
      --black-3: #1A1A1A;
      --black-4: #222222;
      --red:        #C0392B;
      --red-bright: #E74C3C;
      --grey:       #888888;
      --grey-mid:   #555555;
      --grey-dark:  #333333;
      --text:       #E8E8E8;
      --text-muted: #888888;
      --border:        rgba(192,57,43,0.22);
      --border-strong: rgba(192,57,43,0.45);
      --border-grey:   rgba(255,255,255,0.07);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      text-align: center;
      padding: 70px 24px 56px;
      background: var(--black-2);
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 100%, rgba(192,57,43,0.1) 0%, transparent 70%);
    }
    .hero::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(to right, transparent, var(--red), transparent);
    }

    .hero-sup {
      position: relative;
      font-size: 10px; letter-spacing: 5px;
      text-transform: uppercase; color: var(--red-bright);
      font-weight: 400; margin-bottom: 22px;
      display: flex; align-items: center; justify-content: center; gap: 14px;
    }
    .hero-sup::before, .hero-sup::after {
      content: ''; display: block; width: 50px; height: 1px;
    }
    .hero-sup::before { background: linear-gradient(to right, transparent, var(--red)); }
    .hero-sup::after  { background: linear-gradient(to left,  transparent, var(--red)); }

    .hero h1 {
      position: relative;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(48px, 9vw, 82px);
      font-weight: 400; letter-spacing: 1px;
      color: #FFF; line-height: 1.05; margin-bottom: 14px;
    }
    .hero h1 em { font-style: italic; color: var(--red-bright); }

    .hero-tag {
      position: relative;
      font-size: 11px; letter-spacing: 4px;
      text-transform: uppercase; color: var(--grey); font-weight: 400;
    }

    .divider-row {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin: 28px auto;
    }
    .divider-row::before, .divider-row::after {
      content: ''; flex: 1; max-width: 120px; height: 1px;
      background: var(--border-strong);
    }
    .diamond { width: 8px; height: 8px; background: var(--red); transform: rotate(45deg); flex-shrink: 0; }

    .hero-date {
      position: relative;
      font-size: 11px; letter-spacing: 2px;
      color: var(--grey-mid); text-transform: uppercase;
      display: none;
    }

    /* ── STICKY NAV ── */
    .nav-wrap {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,10,0.97);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .nav {
      display: flex; justify-content: center;
      padding: 0 12px; gap: 0;
      overflow-x: auto; scrollbar-width: none;
    }
    .nav::-webkit-scrollbar { display: none; }
    .nav-btn {
      display: block; padding: 15px 16px;
      font-size: 10px; letter-spacing: 3px;
      text-transform: uppercase; font-weight: 400;
      color: var(--grey); text-decoration: none;
      white-space: nowrap; background: none; border: none; cursor: pointer;
      border-bottom: 2px solid transparent;
      font-family: 'DM Sans', sans-serif;
      transition: color .2s, border-color .2s;
    }
    .nav-btn:hover, .nav-btn.active { color: var(--red-bright); border-bottom-color: var(--red); }

    /* ── MAIN ── */
    main { max-width: 860px; margin: 0 auto; padding: 0 20px 80px; }

    /* ── SECTION ── */
    .menu-section { padding-top: 60px; }

    .sec-head { text-align: center; margin-bottom: 36px; }
    .sec-label {
      font-size: 9px; letter-spacing: 5px;
      text-transform: uppercase; color: var(--red-bright);
      font-weight: 400; margin-bottom: 10px;
    }
    .sec-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(26px, 4vw, 38px);
      font-weight: 400; color: #FFF;
    }
    .sec-title em { font-style: italic; color: var(--red-bright); }
    .sec-note {
      margin-top: 8px; font-size: 11px; letter-spacing: 2px;
      color: var(--grey); text-transform: uppercase;
    }

    /* ── MENU LIST ── */
    .menu-list {
      border: 1px solid var(--border);
      border-radius: 3px; overflow: hidden;
    }
    .menu-row {
      display: flex; align-items: center;
      gap: 16px; padding: 16px 22px;
      border-bottom: 1px solid var(--border-grey);
      border-left: 3px solid transparent;
      background: var(--black-2);
      transition: background .2s, border-color .2s;
    }
    .menu-row:last-child { border-bottom: none; }
    .menu-row:hover { background: var(--black-3); border-left-color: var(--red); }

    .row-body { flex: 1; min-width: 0; }
    .row-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px; font-weight: 600;
      color: #FFF; text-transform: capitalize; line-height: 1.2;
    }
    .row-desc {
      font-size: 12px; color: var(--grey);
      margin-top: 2px; letter-spacing: .3px;
    }
    .row-price {
      font-size: 15px; font-weight: 500;
      color: var(--red-bright);
      white-space: nowrap; letter-spacing: .5px;
      min-width: 70px; text-align: right;
    }
    .price-tbd {
      font-size: 11px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--grey-mid);
    }

    /* ── SECTION DIVIDER ── */
    .sep {
      margin: 60px 0 0; border: none;
      border-top: 1px solid var(--border-grey);
      position: relative;
    }
    .sep::after {
      content: '◆';
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 9px; color: var(--red);
      background: var(--black); padding: 0 12px;
    }

    /* ── LOADING ── */
    .spinner-wrap {
      min-height: 40vh;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 20px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--grey-dark);
      border-top-color: var(--red-bright);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-text { font-size: 12px; letter-spacing: 3px; color: var(--grey-mid); text-transform: uppercase; }

    /* ── ERROR ── */
    .error-box {
      display: none;
      margin: 40px auto; max-width: 500px;
      padding: 20px 24px;
      border: 1px solid var(--red);
      border-left: 4px solid var(--red-bright);
      border-radius: 3px;
      background: rgba(192,57,43,0.08);
      color: var(--text); font-size: 14px;
    }

    /* ── FOOTER ── */
    footer {
      text-align: center; padding: 52px 24px 40px;
      border-top: 1px solid var(--border);
      background: var(--black-2);
    }
    .foot-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px; font-weight: 400;
      color: var(--red-bright); margin-bottom: 14px;
    }
    .foot-info {
      font-size: 12px; letter-spacing: 2px;
      color: var(--grey); text-transform: uppercase; line-height: 2.2;
    }
    .foot-line { width: 60px; height: 1px; background: var(--border-strong); margin: 24px auto; }
    .foot-copy { font-size: 10px; color: var(--grey-dark); letter-spacing: 1px; }

    /* ── REVEAL ANIMATION ── */
    .reveal { opacity: 0; transform: translateY(16px); transition: opacity .5s, transform .5s; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 560px) {
      .nav-btn { padding: 13px 11px; font-size: 9px; letter-spacing: 2px; }
      .menu-row { padding: 13px 14px; }
      .row-name { font-size: 16px; }
    }
  </style>
</head>
<body>

<!-- HERO -->
<header class="hero">
  <div class="hero-sup">Digital Menu</div>
  <h1 id="restaurantName">Loading…</h1>
  <p class="hero-tag" id="tagline"></p>
  <div class="divider-row"><div class="diamond"></div></div>
  <p class="hero-date" id="menuDate"></p>
</header>

<!-- STICKY NAV -->
<div class="nav-wrap" id="navWrap" style="display:none">
  <nav class="nav" id="navBar"></nav>
</div>

<!-- MAIN -->
<main>
  <!-- Loading -->
  <div class="spinner-wrap" id="loading">
    <div class="spinner"></div>
    <div class="spinner-text">Loading menu…</div>
  </div>

  <!-- Menu sections -->
  <div id="menuRoot"></div>

  <!-- Error -->
  <div class="error-box" id="errorBox"></div>
</main>

<!-- FOOTER -->
<footer id="footerEl" style="display:none">
  <div class="foot-name" id="footName"></div>
  <div class="foot-info" id="footTagline"></div>
  <div class="foot-line"></div>
  <p class="foot-copy">All prices in PKR &nbsp;·&nbsp; Menu updates automatically</p>
</footer>

<script>
(function () {

  /* ── helpers ── */
  function esc(s) {
    return String(s || '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function fmtPrice(n, currency) {
    const num = Number(n);
    if (isNaN(num) || num === 0) return '<span class="price-tbd">Ask</span>';
    try {
      return new Intl.NumberFormat(undefined, {
        style: 'currency', currency: currency || 'PKR', maximumFractionDigits: 0
      }).format(num);
    } catch {
      return (currency || 'Rs.') + ' ' + num;
    }
  }

  /* ── section label helper ── */
  function sectionLabel(name) {
    const n = name.toLowerCase();
    if (n.includes('breakfast') && n.includes('weekend')) return 'Saturday & Sunday Only';
    if (n.includes('breakfast')) return 'Start Your Day';
    if (n.includes('refresh') || n.includes('fast food') || n.includes('snack')) return 'Afternoon Bites';
    if (n.includes('beverage') || n.includes('drink')) return 'Hot & Cold';
    if (n.includes('salad') || n.includes('condiment')) return 'On the Side';
    if (n.includes('staple') || n.includes('bread')) return 'Breads';
    if (n.includes('kids')) return 'For the Little Ones';
    if (n.includes('dessert') || n.includes('sweet')) return 'Sweet Finale';
    if (n.includes('main') || n.includes('karahi') || n.includes('biryani')) return 'Heart of the Menu';
    if (n.includes('bbq') || n.includes('grill')) return 'Fire & Smoke';
    return 'Our Selection';
  }

  /* ── time note extractor ── */
  function timeNote(name) {
    const m = name.match(/\(([^)]+)\)/);
    return m ? m[1] : '';
  }

  /* ── section id ── */
  function toId(name, idx) {
    return 'sec-' + idx;
  }

  /* ── render ── */
  function render(data) {
    /* Header */
    const rname = data.restaurantName || 'Menu';
    document.getElementById('restaurantName').innerHTML =
      rname.replace(/(\S+)\s*$/, '<em>$1</em>');
    document.getElementById('tagline').textContent = data.tagline || '';

    const md = data.menuDate || (data.updatedAt || '').slice(0, 10) || '';
    if (md) {
      const dateEl = document.getElementById('menuDate');
      dateEl.textContent = 'Menu for ' + md;
      dateEl.style.display = 'block';
    }

    /* Footer */
    document.getElementById('footName').textContent = rname;
    document.getElementById('footTagline').textContent = data.tagline || '';
    document.getElementById('footerEl').style.display = '';

    const cats = Array.isArray(data.categories) ? data.categories : [];
    const root = document.getElementById('menuRoot');
    const navBar = document.getElementById('navBar');
    root.innerHTML = '';
    navBar.innerHTML = '';

    cats.forEach(function (cat, idx) {
      const id = toId(cat.name, idx);
      const items = Array.isArray(cat.items) ? cat.items : [];
      const note = timeNote(cat.name);
      /* clean name: strip time part */
      const cleanName = cat.name.replace(/\s*\([^)]*\)/g, '').trim();
      const label = sectionLabel(cat.name);

      /* nav button */
      const btn = document.createElement('button');
      btn.className = 'nav-btn' + (idx === 0 ? ' active' : '');
      btn.textContent = cleanName;
      btn.dataset.target = id;
      btn.addEventListener('click', function () {
        document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      navBar.appendChild(btn);

      /* section */
      const sec = document.createElement('section');
      sec.className = 'menu-section reveal';
      sec.id = id;

      /* items html */
      const rowsHtml = items.map(function (it) {
        const desc = (it.description || '').trim();
        return '<div class="menu-row">' +
          '<div class="row-body">' +
            '<div class="row-name">' + esc(it.name) + '</div>' +
            (desc ? '<div class="row-desc">' + esc(desc) + '</div>' : '') +
          '</div>' +
          '<div class="row-price">' + fmtPrice(it.price, data.currency) + '</div>' +
        '</div>';
      }).join('');

      sec.innerHTML =
        (idx > 0 ? '<hr class="sep">' : '') +
        '<div class="sec-head">' +
          '<div class="sec-label">' + esc(label) + '</div>' +
          '<h2 class="sec-title">' + esc(cleanName) + '</h2>' +
          (note ? '<p class="sec-note">' + esc(note) + '</p>' : '') +
        '</div>' +
        '<div class="menu-list">' +
          (rowsHtml || '<div class="menu-row"><div class="row-body"><div class="row-name" style="color:var(--grey)">No items yet</div></div></div>') +
        '</div>';

      root.appendChild(sec);
    });

    /* show nav */
    if (cats.length) document.getElementById('navWrap').style.display = '';

    /* hide loader */
    document.getElementById('loading').style.display = 'none';

    /* scroll spy */
    const allSecs = document.querySelectorAll('.menu-section');
    const allBtns = document.querySelectorAll('.nav-btn');
    allSecs.forEach(function (s) {
      new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {
            allBtns.forEach(function (b) {
              b.classList.toggle('active', b.dataset.target === s.id);
            });
          }
        });
      }, { rootMargin: '-40% 0px -55% 0px' }).observe(s);
    });

    /* reveal animation */
    allSecs.forEach(function (el) {
      new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) e.target.classList.add('visible');
        });
      }, { threshold: 0.08 }).observe(el);
    });
  }

  function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    const e = document.getElementById('errorBox');
    e.textContent = msg;
    e.style.display = 'block';
  }

  /* ── fetch ── */
  fetch('menu.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('Could not load menu.json (' + r.status + ').');
      return r.json();
    })
    .then(render)
    .catch(function (err) { showError(err.message || 'Failed to load menu.'); });

})();
</script>
</body>
</html>
